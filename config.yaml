# CyberBron Configuration File

# Model Settings
models:
  llm: "llama3:8b-instruct-q8_0"
  embeddings: "nomic-embed-text"
  temperature: 0.7
  
# Ollama Settings
ollama:
  base_url: "http://localhost:11434"
  timeout: 120  # seconds

# RAG Settings
rag:
  chunk_size: 1000
  chunk_overlap: 200
  retrieval_k: 5
  max_history_messages: 20  # Limit history to prevent memory issues

# Response Settings
response:
  min_words: 300  # Reduced from 500 for better efficiency
  streaming: true
  
# Persona Settings
persona:
  name: "CyberBron"
  humor_level: "moderate"  # low, moderate, high
  min_jokes_per_response: 2  # Reduced from 4 for less forced humor

# Paths
paths:
  data: "data"
  chroma_db: "chroma_db"
  conversations: "conversations"

# Web Scraping (for ingest.py)
web_sources:
  - "https://owasp.org/www-project-top-ten/"
  - "https://www.cisa.gov/shields-up"
  - "https://attack.mitre.org/techniques/enterprise/"

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>CyberBron — Access Required</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-logo">🛡️</div>
    <h1>CyberBron</h1>
    <p class="auth-subtitle">AI Cybersecurity Study Platform</p>
    <p class="auth-hint">This instance is shared. Enter the access token to continue.</p>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('login', next=request.args.get('next','')) }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="token">Access Token</label>
        <input type="password" id="token" name="token" placeholder="Enter access token…" autofocus required>
      </div>
      <button type="submit" class="btn btn-primary btn-full">🔐 Enter</button>
    </form>
  </div>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
